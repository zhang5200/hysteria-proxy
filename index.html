<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteria 管理面板</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <canvas id="network-bg"></canvas>
        <div class="login-card">
            <svg class="login-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <circle cx="19" cy="5" r="2" />
                <circle cx="5" cy="5" r="2" />
                <circle cx="5" cy="19" r="2" />
                <circle cx="19" cy="19" r="2" />
                <path d="M10.5 10.5L6.5 6.5" />
                <path d="M13.5 13.5L17.5 17.5" />
                <path d="M13.5 10.5L17.5 6.5" />
                <path d="M10.5 13.5L6.5 17.5" />
            </svg>
            <div class="login-title">Hysteria</div>
            <div class="input-group">
                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <input type="text" id="loginUsername" placeholder="请输入账号...">
                </div>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <input type="password" id="loginPassword" placeholder="请输入密码..."
                        onkeyup="if(event.key === 'Enter') checkLogin()">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1; justify-content: center; padding: 14px;"
                    onclick="checkLogin()">
                    登录验证
                </button>
                <button class="btn btn-light" style="flex: 1; justify-content: center; padding: 14px;"
                    onclick="showRegisterModal()">
                    注册账号
                </button>
            </div>
            <p id="loginError" style="color: var(--danger); margin-top: 16px; display: none; font-size: 14px;">
                账号或密码错误，请重试
            </p>
        </div>

        <div id="registerModal" class="modal">
            <div class="modal-content" style="max-width: 420px;">
                <div class="modal-header">
                    <h3 class="modal-title">注册账号</h3>
                    <span class="close-btn" onclick="closeRegisterModal()">&times;</span>
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="display:block; text-align:left; margin-bottom:8px;">账号</label>
                    <input type="text" id="registerUsername" placeholder="请输入账号">
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="display:block; text-align:left; margin-bottom:8px;">密码</label>
                    <input type="password" id="registerPassword" placeholder="请输入密码"
                        onkeyup="if(event.key === 'Enter') registerAccount()">
                </div>
                <p style="color: var(--text-secondary); margin: 0 0 12px 0; font-size: 12px; text-align: left;">
                    账号: 4-20位字母/数字/下划线，且以字母开头；密码: 8-32位，需含大小写字母、数字、特殊字符
                </p>
                <p id="registerError" style="color: var(--danger); margin: 0 0 12px 0; display: none; font-size: 13px;"></p>
                <div style="text-align: right;">
                    <button class="btn btn-danger" onclick="closeRegisterModal()" style="margin-right: 8px;">取消</button>
                    <button class="btn btn-primary" onclick="registerAccount()">注册并登录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainApp" style="opacity: 0; transition: opacity 0.5s;">
        <div class="app-layout">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <circle cx="19" cy="5" r="2" />
                        <circle cx="5" cy="5" r="2" />
                        <circle cx="5" cy="19" r="2" />
                        <circle cx="19" cy="19" r="2" />
                        <path d="M10.5 10.5L6.5 6.5" />
                        <path d="M13.5 13.5L17.5 17.5" />
                        <path d="M13.5 10.5L17.5 6.5" />
                        <path d="M10.5 13.5L6.5 17.5" />
                    </svg>
                    <span>Hysteria</span>
                </div>

                <div class="sidebar-menu">
                    <button class="menu-item active" data-tab="users" onclick="switchTab('users')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        用户管理
                    </button>
                    <button class="menu-item" data-tab="nodes" onclick="switchTab('nodes')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        节点管理
                    </button>
                    <button class="menu-item" data-tab="account" onclick="switchTab('account')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        账号管理
                    </button>
                </div>

                <div class="sidebar-footer">
                    <button class="menu-item logout-btn" onclick="logout()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        退出登录
                    </button>
                </div>
            </div>

            <!-- Right Content Area -->
            <div class="main-content">
                <div class="top-bar">
                    <div class="page-title">管理控制台</div>
                    <div style="display: flex; align-items: center; gap: 24px;">
                        <a href="/api/public/pdf-preview/BdPbFVnS" target="_blank" rel="noopener noreferrer"
                           style="display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: color 0.2s;"
                           onmouseover="this.style.color='var(--primary)'"
                           onmouseout="this.style.color='var(--text-secondary)'">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                            VPN 使用说明
                        </a>
                        <div class="user-info" style="cursor: pointer;" onclick="showChangePasswordModal()">
                            <span>Admin</span>
                            <div class="avatar">A</div>
                        </div>
                    </div>
                </div>

                <div class="content-scroll-area">
                    <!-- Users Tab -->
                    <div id="usersTab" class="tab-content active">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                            <h3 style="margin: 0; font-size: 20px; font-weight: 700;">用户列表</h3>
                            <button class="btn btn-primary" id="addUserBtn" onclick="showAddUserModal()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                                添加用户
                            </button>
                        </div>

                        <div class="data-grid" id="userTable">
                            <!-- Cards injected here -->
                        </div>
                    </div>

                    <!-- Nodes Tab -->
                    <div id="nodesTab" class="tab-content">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                            <h3 style="margin: 0; font-size: 20px; font-weight: 700;">节点列表</h3>
                            <button class="btn btn-primary display flex" onclick="showAddNodeModal()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                                添加节点
                            </button>
                        </div>

                        <div class="data-grid" id="nodeTable">
                            <!-- Cards injected here -->
                        </div>
                    </div>

                    <!-- Account Management Tab -->
                    <div id="accountTab" class="tab-content">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                            <h3 style="margin: 0; font-size: 20px; font-weight: 700;">账号管理</h3>
                            <button class="btn btn-primary" onclick="showAddAdminUserModal()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                                添加账号
                            </button>
                        </div>

                        <div class="data-grid" id="accountTable">
                            <!-- Account cards injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="userModalTitle">添加用户</h3>
                <span class="close-btn" onclick="closeUserModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="usernameInput" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="text" id="passwordInput" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>流量限制</label>
                <input type="number" id="trafficLimitInput" placeholder="GB (0=无限制)" min="0" step="1" value="0">
            </div>
            <div class="form-group">
                <label style="width: auto; margin-right: 0;">
                    <input type="checkbox" id="autoDisableInput" checked style="width: auto; margin-right: 8px;"> 超限自动停用
                </label>
            </div>
            <div style="text-align: right; margin-top: 24px;">
                <button class="btn btn-danger" onclick="closeUserModal()" style="margin-right: 8px;">取消</button>
                <button class="btn btn-primary" onclick="saveUser()">保存用户</button>
            </div>
        </div>
    </div>

    <div id="nodeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="nodeModalTitle">添加节点</h3>
                <span class="close-btn" onclick="closeNodeModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>节点名称</label>
                <input type="text" id="nodeNameInput" placeholder="例如: HongKong-01">
            </div>
            <div class="form-group">
                <label>节点地址</label>
                <input type="text" id="nodeHostInput" placeholder="例如: 192.168.1.1:8080">
            </div>
            <div class="form-group">
                <label>访问密钥</label>
                <input type="text" id="nodeSecretInput" placeholder="节点通信密钥">
            </div>
            <div style="text-align: right; margin-top: 24px;">
                <button class="btn btn-danger" onclick="closeNodeModal()" style="margin-right: 8px;">取消</button>
                <button class="btn btn-primary" onclick="saveNode()">保存节点</button>
            </div>
        </div>
    </div>

    <div id="adminUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="adminUserModalTitle">添加账号</h3>
                <span class="close-btn" onclick="closeAdminUserModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="adminUsernameInput" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="adminPasswordInput" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="adminRoleInput"
                    style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div style="text-align: right; margin-top: 24px;">
                <button class="btn btn-danger" onclick="closeAdminUserModal()" style="margin-right: 8px;">取消</button>
                <button class="btn btn-primary" onclick="saveAdminUser()">保存账号</button>
            </div>
        </div>
    </div>

    <div id="subscriptionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="subscriptionModalTitle">订阅</h3>
                <span class="close-btn" onclick="closeSubscriptionModal()">&times;</span>
            </div>
            <div id="subscriptionModalBody"></div>
        </div>
    </div>

    <div id="changePasswordModal" class="modal">
        <div class="modal-content" style="max-width: 420px;">
            <div class="modal-header">
                <h3 class="modal-title">修改密码</h3>
                <span class="close-btn" onclick="closeChangePasswordModal()">&times;</span>
            </div>
            <div style="margin-bottom: 14px;">
                <label style="display:block; text-align:left; margin-bottom:8px;">账号</label>
                <input type="text" id="changePasswordUsername" readonly>
            </div>
            <div style="margin-bottom: 14px;">
                <label style="display:block; text-align:left; margin-bottom:8px;">新密码</label>
                <input type="password" id="changePasswordInput" placeholder="请输入新密码"
                    onkeyup="if(event.key === 'Enter') submitChangePassword()">
            </div>
            <p style="color: var(--text-secondary); margin: 0 0 12px 0; font-size: 12px; text-align: left;">
                密码需为8-32位，且包含大写字母、小写字母、数字、特殊字符
            </p>
            <p id="changePasswordError"
                style="color: var(--danger); margin: 0 0 12px 0; display: none; font-size: 13px;"></p>
            <div style="text-align: right;">
                <button class="btn btn-danger" onclick="closeChangePasswordModal()"
                    style="margin-right: 8px;">取消</button>
                <button class="btn btn-primary" onclick="submitChangePassword()">保存</button>
            </div>
        </div>
    </div>


    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Application Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/subscription.js"></script>
    <script src="/static/js/login-bg.js"></script>

</body>

</html>
